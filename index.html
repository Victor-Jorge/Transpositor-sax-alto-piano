<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e1116">
  <title>Transposição do sax alto em Mi bemol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topo">
      <h1>Sax alto Eb <span class="seta" aria-hidden="true">→</span> piano</h1>
    </header>

    <p id="aviso" class="aviso" role="status" hidden>
      Não foi possível salvar no navegador. O app continua funcionando, mas o histórico se perde ao fechar a página.
    </p>

    <main>
      <!-- QUIZ -->
      <section id="tela-quiz" aria-label="Quiz">
        <div class="barra">
          <button type="button" class="pilula" id="nivel-atual" aria-label="Nível atual. Abrir ajustes"></button>
          <p class="placar" aria-label="Placar da sessão">
            <span class="placar__item placar__item--ok"><strong id="placar-acertos">0</strong> acertos</span>
            <span class="placar__item placar__item--erro"><strong id="placar-erros">0</strong> erros</span>
          </p>
        </div>

        <div class="pergunta" id="pergunta">
          <span class="chip" id="pergunta-chip"></span>
          <p class="pergunta__nota" id="pergunta-nota"></p>
          <p class="pergunta__texto" id="pergunta-texto"></p>
        </div>

        <div class="respostas" id="respostas" role="group" aria-label="Opções de resposta"></div>

        <div id="feedback" class="feedback" aria-live="polite" hidden></div>
      </section>

      <!-- TABELA -->
      <section id="tela-tabela" aria-label="Tabela de transposição" hidden>
        <h2>Tabela</h2>
        <p class="explica">O sax lê a nota da esquerda; o que soa no piano é a da direita.</p>
        <div class="rolagem-tabela"><table id="tabela-completa"></table></div>
      </section>

      <!-- HISTÓRICO -->
      <section id="tela-historico" aria-label="Histórico" hidden>
        <h2>Histórico</h2>
        <div id="historico-conteudo"></div>
        <button type="button" class="botao botao--perigo" id="btn-limpar">Limpar histórico</button>
      </section>

      <!-- AJUSTES (tela separada) -->
      <section id="tela-ajustes" aria-label="Ajustes" hidden>
        <h2>Ajustes</h2>
        <h3 id="t-nivel">Dificuldade</h3>
        <div class="opcoes" id="seg-nivel" role="group" aria-labelledby="t-nivel"></div>
        <h3 id="t-nomen">Nomes das notas</h3>
        <div class="opcoes" id="seg-nomenclatura" role="group" aria-labelledby="t-nomen"></div>
        <button type="button" class="botao botao--principal botao--largo" id="btn-voltar">Voltar ao quiz</button>
      </section>
    </main>
  </div>

  <nav class="abas" aria-label="Seções">
    <button type="button" data-tela="quiz">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3Zm10-2a3 3 0 1 1-3-3 3 3 0 0 1 3 3Z"/></svg>Quiz
    </button>
    <button type="button" data-tela="tabela">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM4 10h16M4 15h16M12 5v14"/></svg>Tabela
    </button>
    <button type="button" data-tela="historico">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Histórico
    </button>
    <button type="button" data-tela="ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg>Ajustes
    </button>
  </nav>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
